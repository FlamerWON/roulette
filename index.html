<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рулетка с чатом</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#efe9dc; --felt:#1f5a3f; --ink:#1b1b18; --muted:#6b675c;
  --card:#fbf8f1; --line:#d8d0bd; --gold:#b8892f; --red:#b3261e; --black:#1a1a1a; --green:#1f7a4d;
  --mine:#e7dcc0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10231a; --felt:#0c1a13; --ink:#f1ecde; --muted:#9db3a5;
    --card:#17301f; --line:#2b4a38; --gold:#e0b550; --mine:#24472f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10231a; --felt:#0c1a13; --ink:#f1ecde; --muted:#9db3a5;
  --card:#17301f; --line:#2b4a38; --gold:#e0b550; --mine:#24472f; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:24px 16px 40px;
}
[hidden]{display:none!important}
h1{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(34px,8vw,52px);margin:0;letter-spacing:.01em}
button,input{font:inherit}
button{font-weight:700;cursor:pointer;border:0;border-radius:999px;background:var(--gold);color:#1b1405;padding:12px 30px;font-size:17px}
button:hover:not(:disabled){filter:brightness(1.06)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px;min-width:0}

/* вход */
#login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center}
#login p{margin:0;color:var(--muted)}
#login input{text-align:center;font-size:18px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chatHead button{padding:4px 12px;font-size:13px;flex:none}
#loginErr{min-height:20px;color:var(--red);font-size:14px}

/* основной экран */
.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:28px;width:min(1080px,100%);margin:0 auto;align-items:start}
.wheelCol{display:flex;flex-direction:column;align-items:center;gap:20px}
.stage{position:relative;width:min(88vw,420px);aspect-ratio:1;margin-top:18px}
canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 10px var(--felt),0 0 0 12px var(--gold),0 14px 34px rgba(0,0,0,.28)}
.pointer{position:absolute;left:50%;top:-16px;width:0;height:0;transform:translateX(-50%);border-left:13px solid transparent;border-right:13px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));z-index:2}
.result{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:124px;justify-content:center}
.num{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(72px,20vw,100px);line-height:1;min-width:2ch;text-align:center;padding:0 .25em;border-radius:18px;color:#fff;background:var(--muted);transition:background .25s}
.red{background:var(--red)} .black{background:var(--black)} .green{background:var(--green)}
.label{color:var(--muted);font-size:15px;min-height:22px}

/* вкладки и персонаж */
.rightCol{display:flex;flex-direction:column;gap:18px;align-items:center;min-width:0}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tab{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 22px;font-size:16px}
.tab.on{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:8px;vertical-align:middle}
#toast{min-height:34px}
#toast.on{background:var(--gold);color:#1b1405;font-weight:700;padding:6px 16px;border-radius:999px;text-align:center}
.charPane{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:520px}
.hero{text-align:center}
.hero .name{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(30px,7vw,40px)}
.hero .cur{display:inline-block;margin-top:6px;padding:6px 20px;border-radius:999px;background:var(--gold);color:#1b1405;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:10px;width:100%}
.titem{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.titem.locked{opacity:.6}
.titem .tn{font-weight:700}
.titem .td{font-size:13px;color:var(--muted)}
.titem button{padding:6px 16px;font-size:14px;flex:none}
.titem .lock{font-size:13px;color:var(--muted);flex:none}
.tt{font-size:11px;font-weight:700;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--gold);color:#1b1405}

/* аватары */
.av{display:inline-block;flex:none;width:36px;height:36px;border-radius:10px;overflow:hidden}
.av svg{display:block;width:100%;height:100%}
.charAv{width:150px;height:150px;margin:0 auto 8px}
.charAv svg{display:block;width:100%;height:100%}
svg.chr{overflow:visible}
.chr .chrBob{animation:chrBob .9s ease-in-out infinite}
.chr .armL,.chr .armR{animation:chrArm .9s ease-in-out infinite}
.chr .armL{transform-origin:37px 86px}
.chr .armR{transform-origin:63px 86px}
.chr .legL,.chr .legR{animation:chrStep .9s ease-in-out infinite}
.chr .legR{animation-delay:-.45s}
.chr .chead{transform-origin:50px 80px;animation:chrTilt 1.8s ease-in-out infinite}
.chr .eyes{transform-origin:50px 52px;animation:chrBlink 4s infinite}
.chr .deco{transform-origin:50px 30px;animation:chrWob 1.8s ease-in-out infinite}
.chr .sh{transform-origin:50px 138px;animation:chrShadow .9s ease-in-out infinite}
@keyframes chrBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes chrArm{0%,100%{transform:rotate(14deg)}50%{transform:rotate(-14deg)}}
@keyframes chrStep{0%,50%,100%{transform:translateY(0)}25%{transform:translateY(-3px)}}
@keyframes chrTilt{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes chrBlink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes chrWob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes chrShadow{0%,100%{transform:scale(1)}50%{transform:scale(.85)}}
@media (prefers-reduced-motion:reduce){.chr *{animation:none!important}}
.msg .body{min-width:0}

/* снаряжение и инвентарь */
.equipWrap{display:grid;grid-template-columns:72px 1fr 72px;gap:12px;align-items:start;width:100%}
.eqCol{display:flex;flex-direction:column;gap:10px;padding-top:6px}
.slot{aspect-ratio:1;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;color:var(--muted);background:var(--card);padding:2px}
.invTitle{align-self:flex-start;font-family:'DM Serif Display',Georgia,serif;font-size:20px}
.inv{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;width:100%}
.cell{aspect-ratio:1;border:2px dashed var(--line);border-radius:12px;background:var(--card)}

/* лидерборд */
.boardPane{width:100%;max-width:520px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.bt{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:30px;margin:0;text-align:center}
.board{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.brow.me{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.rk{min-width:30px;text-align:center;font-weight:700;color:var(--muted);padding:2px 0;border-radius:8px}
.rk.top{background:var(--gold);color:#1b1405}
.bn{flex:1;min-width:0;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs{font-weight:700;flex:none}
.bs small{font-weight:500;color:var(--muted)}
.bempty{text-align:center;color:var(--muted);padding:20px 0}

/* монеты */
#app{padding-top:34px}
.coinBox{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:20;display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--gold);border-radius:14px;padding:4px 12px 4px 8px;font-weight:700;font-size:18px;box-shadow:0 4px 12px rgba(0,0,0,.18)}
.coinBox svg{width:28px;height:28px;display:block}
.coinBox.pop{animation:coinPop .35s ease}
@keyframes coinPop{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
.raceTag{display:inline-block;margin:6px 0 0;padding:2px 12px;border-radius:999px;color:#fff;font-size:13px;font-weight:700}
.titleLine{align-self:center;font-size:13px;color:var(--muted);text-align:center;padding:2px 8px}

/* магазин */
.shopPane{width:100%;max-width:520px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:12px}
.card h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:24px;margin:0}
.card p{margin:0;color:var(--muted);font-size:14px}
.chestRow{display:flex;gap:14px;align-items:center}
.chest{width:104px;flex:none}
.chest svg{display:block;width:100%}
.chest.shake{animation:chrShake .45s ease-in-out infinite}
@keyframes chrShake{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@media (prefers-reduced-motion:reduce){.chest.shake{animation:none}}
.price{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.price svg{width:22px;height:22px}
.odds{display:flex;flex-wrap:wrap;gap:6px}
.rar{display:inline-block;color:#fff;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.drop{display:flex;gap:14px;align-items:center;background:var(--bg);border-radius:14px;padding:10px}
.drop .charAv{width:100px;height:100px;margin:0;flex:none}
.rrow{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rrow.locked{opacity:.6}
.rrow button{padding:6px 16px;font-size:14px;flex:none}
.rn{font-weight:700}
.rd{font-size:13px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipx{border:2px dashed var(--line);border-radius:12px;padding:6px 16px;color:var(--muted);font-weight:700}
.chr .tail{transform-origin:63px 104px;animation:chrWag 1.2s ease-in-out infinite}
@keyframes chrWag{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(10deg)}}

/* слоты с предметами */
.slot{flex-direction:column;gap:2px}
.slot svg{width:36px;height:36px;display:block}
.slot .sn{font-size:10px;line-height:1.1;color:var(--ink)}

/* событие и бой */
.eventBar{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:8px 14px}
.eventBar.live{border-color:var(--red);box-shadow:0 0 0 1px var(--red)}
.evT{font-weight:700}
.evS{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.eventBar button{padding:6px 18px;font-size:15px;flex:none}
.fight{width:100%;max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:10px}
.fhead{display:flex;gap:12px;align-items:center}
.mon{width:84px;height:84px;flex:none;border-radius:16px;overflow:hidden;background:var(--bg)}
.mon svg{width:100%;height:100%;display:block}
.bar{height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:999px}
.bar.m i{background:var(--red)}
.bar.p i{background:var(--green)}
.hpl{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:3px}
.flog{font-size:14px;min-height:20px}

/* окно подтверждения */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.mbox{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:16px}
.mbox p{margin:0;line-height:1.4}
.mbtns{display:flex;gap:10px;justify-content:flex-end}

/* чат */
.chat{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;height:min(72vh,600px);overflow:hidden}
.chatHead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chatHead b{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:22px}
.chatHead span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.msg{display:flex;gap:8px;align-items:flex-start;max-width:92%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{background:var(--mine);align-self:flex-end}
.msg .who{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.spinLine{align-self:center;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;text-align:center}
.chip{min-width:30px;padding:2px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:13px;text-align:center}
.empty{margin:auto;color:var(--muted);font-size:14px;text-align:center}
.chatForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatForm input{flex:1}
.chatForm button{padding:10px 18px;font-size:16px}
#chatNote{padding:0 12px 10px;color:var(--red);font-size:13px;min-height:0}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .rightCol{order:-1}
  .chat{height:420px}
}
</style>
</head>
<body>

<div id="coinBox" class="coinBox" hidden aria-label="Монеты"></div>

<div id="login">
  <h1>Рулетка</h1>
  <p>Войди или создай аккаунт</p>
  <input id="nick" maxlength="15" autocomplete="username" placeholder="Имя" aria-label="Имя">
  <input id="pass" type="password" maxlength="64" autocomplete="current-password" placeholder="Пароль (от 6 символов)" aria-label="Пароль">
  <div id="loginErr" aria-live="polite"></div>
  <button id="enter">Войти</button>
  <button id="signup" class="ghost">Создать аккаунт</button>
</div>

<div id="app" hidden>
  <div class="layout">
    <section class="chat" aria-label="Чат">
      <div class="chatHead"><b>Чат</b><span id="me"></span><button id="logout" class="ghost">Выйти</button></div>
      <div id="msgs" aria-live="polite"></div>
      <div id="chatNote"></div>
      <div class="chatForm">
        <input id="msgIn" maxlength="300" placeholder="Напиши сообщение" aria-label="Сообщение" autocomplete="off">
        <button id="send">Отправить</button>
      </div>
    </section>

    <div class="rightCol">
    <div class="tabs">
      <button id="tabGame" class="tab on">Рулетка</button>
      <button id="tabChar" class="tab">Персонаж<span id="dot" class="dot" hidden></span></button>
      <button id="tabBoard" class="tab">Лидеры</button>
      <button id="tabShop" class="tab">Магазин</button>
    </div>
    <div class="eventBar" id="eventBar">
      <div><div class="evT" id="evT"></div><div class="evS" id="evS"></div></div>
      <button id="evBtn" hidden>Сразиться</button>
    </div>
    <section class="wheelCol" id="gamePane">
      <h1>Рулетка</h1>
      <div class="stage">
        <div class="pointer"></div>
        <canvas id="wheel" aria-label="Колесо рулетки"></canvas>
      </div>
      <div class="result" aria-live="polite">
        <div class="num" id="num">?</div>
        <div class="label" id="label">Нажми «Крутить»</div>
      </div>
      <div id="toast" aria-live="polite"></div>
      <div class="fight" id="fight" hidden></div>
      <button id="spin">Крутить</button>
    </section>

    <section class="charPane" id="charPane" hidden>
      <div class="equipWrap">
        <div class="eqCol">
          <div class="slot" id="slotHead" aria-label="Голова: пусто">Голова</div>
          <div class="slot" id="slotBody" aria-label="Тело: пусто">Тело</div>
        </div>
        <div class="hero"><div class="charAv" id="charAv"></div><div class="name" id="charName"></div><div class="cur" id="charTitle"></div><div class="raceTag" id="charRace"></div> <div class="raceTag" id="charClass"></div></div>
        <div class="eqCol">
          <div class="slot" id="slotArms" aria-label="Руки: пусто">Руки</div>
          <div class="slot" id="slotLegs" aria-label="Ноги: пусто">Ноги</div>
        </div>
      </div>
      <div class="invTitle">Инвентарь</div>
      <div class="inv" aria-label="Инвентарь: пусто"><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div></div>
      <div class="stats">
        <div class="stat"><b id="stSpins">0</b><span>Прокруток</span></div>
        <div class="stat"><b id="stRed">0</b><span>Красное</span></div>
        <div class="stat"><b id="stBlack">0</b><span>Чёрное</span></div>
        <div class="stat"><b id="stZero">0</b><span>Зеро</span></div>
        <div class="stat"><b id="stHp">100</b><span>Здоровье</span></div>
        <div class="stat"><b id="stAtk">5</b><span>Урон</span></div>
      </div>
      <div class="tlist" id="tlist"></div>
    </section>

    <section class="boardPane" id="boardPane" hidden>
      <h2 class="bt">Рейтинг по прокрутам</h2>
      <div class="board" id="board"></div>
      <button id="boardRefresh" class="ghost">Обновить</button>
    </section>

    <section class="shopPane" id="shopPane" hidden><div id="shopBody"></div></section>
    </div>
  </div>
</div>

<div class="modal" id="modal" hidden role="dialog" aria-modal="true">
  <div class="mbox"><p id="mText"></p><div class="mbtns"><button id="mNo" class="ghost">Отмена</button><button id="mYes">Да</button></div></div>
</div>

<script src="config.js"></script>
<script>
(function(){
  var ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  var REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
  var N=ORDER.length, SEG=2*Math.PI/N, TAU=2*Math.PI;
  function $(id){return document.getElementById(id);}
  function color(n){return n===0?'green':(REDS.indexOf(n)>-1?'red':'black');}
  var FILL={green:'#1f7a4d',red:'#b3261e',black:'#1a1a1a'};
  var nick='', uid='', game=null;

  /* ---------- аккаунты (Firebase Authentication через обычные запросы) ---------- */
  var sess=null;
  var nickIn=$('nick'), passIn=$('pass'), errEl=$('loginErr');
  function setErr(t){errEl.textContent=t||'';}
  function setBusy(v){$('enter').disabled=v; $('signup').disabled=v;}
  function persist(){try{localStorage.setItem('roulette_sess',JSON.stringify({refreshToken:sess.refreshToken}));}catch(e){}}
  // Firebase входит по почте, поэтому из имени делаем служебный адрес (имя кодируется в hex)
  function emailFor(name){
    var bytes=new TextEncoder().encode(name.toLowerCase()), h='u';
    bytes.forEach(function(x){h+=('0'+x.toString(16)).slice(-2);});
    return h+'@roulette.example.com';
  }
  function msgFor(c){
    if(c.indexOf('EMAIL_EXISTS')>-1) return 'Такое имя уже занято';
    if(/INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|INVALID_PASSWORD/.test(c)) return 'Неверное имя или пароль';
    if(c.indexOf('WEAK_PASSWORD')>-1) return 'Пароль слишком простой: минимум 6 символов';
    if(c.indexOf('OPERATION_NOT_ALLOWED')>-1) return 'В Firebase не включён вход по почте и паролю';
    if(/API_KEY|API key/i.test(c)) return 'Неверный API-ключ в файле';
    if(c.indexOf('TOO_MANY_ATTEMPTS')>-1) return 'Слишком много попыток, подожди немного';
    if(c.indexOf('PROFILE_WRITE')>-1) return 'Не удалось сохранить профиль: проверь правила в Firebase';
    if(c.indexOf('fetch')>-1) return 'Не удалось связаться с сервером';
    return 'Ошибка: '+c;

  function authCall(path,body){
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+path+'?key='+encodeURIComponent(API_KEY),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();});
  }
  function refresh(){
    return fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(API_KEY),
      {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
       body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(sess.refreshToken)})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.error) throw (d.error.message||'REFRESH');
        sess.idToken=d.id_token; sess.refreshToken=d.refresh_token; sess.uid=d.user_id;
        sess.exp=Date.now()+(Number(d.expires_in)||3600)*1000; persist(); return sess.idToken;
      });
  }
  function token(){
    if(!sess) return Promise.reject('NO_SESSION');
    if(sess.idToken&&Date.now()<sess.exp-60000) return Promise.resolve(sess.idToken);
    return refresh();
  }
  // имя профиля хранится в базе, так его нельзя подделать в чате (проверяют правила)
  function ensureProfile(typed){
    return token().then(function(t){
      var url=DB_URL+'/users/'+sess.uid;
      return fetch(url+'/name.json?auth='+encodeURIComponent(t)).then(function(r){return r.json();}).then(function(v){
        if(typeof v==='string') return v;
        if(!typed) throw 'NO_PROFILE';
        return fetch(url+'/name.json?auth='+encodeURIComponent(t),{method:'PUT',body:JSON.stringify(typed)})
          .then(function(r){ if(!r.ok) throw 'PROFILE_WRITE'; return typed; });
      });
    });
  }
  function submit(mode){
    setErr('');
    if(!configured()){setErr('В файле config.js не заполнен API_KEY');return;}
    var name=nickIn.value.replace(/\s+/g,' ').trim(), pass=passIn.value;
    if(name.length<2||name.length>15){setErr('Имя: от 2 до 15 символов');return;}
    if(pass.length<6){setErr('Пароль: не короче 6 символов');return;}
    setBusy(true);
    authCall(mode==='signUp'?'signUp':'signInWithPassword',{email:emailFor(name),password:pass,returnSecureToken:true})
      .then(function(d){
        if(d.error) throw (d.error.message||'ERROR');
        sess={uid:d.localId,idToken:d.idToken,refreshToken:d.refreshToken,exp:Date.now()+(Number(d.expiresIn)||3600)*1000};
        persist(); return ensureProfile(name);
      })
      .then(function(n){ sess.name=n; start(); })
      .catch(function(e){ sess=null; setErr(msgFor(String(e))); })
      .then(function(){ setBusy(false); });
  }

  function renderEvent(){
    var bar=$('eventBar'); if(!bar||$('app').hidden) return;
    var now=Date.now(), slot=Math.floor(now/HOUR), el=now-slot*HOUR, mo=monsterFor(slot);
    var live=el<EVENT_MS, f=game&&game.fight, T, S, btn=false;
    if(live){
      T='Событие: '+mo.name;
      if(f&&f.on&&f.s===slot) S='Бой идёт';
      else if(f&&f.s===slot) S='Ты уже сразился с этим монстром';
      else{ S='Монстр уйдёт через '+fmt(EVENT_MS-el); btn=!!game; }
    }else{
      T='Следующий монстр'; S='Появится через '+fmt(HOUR-el);
    }
    $('evT').textContent=T; $('evS').textContent=S; $('evBtn').hidden=!btn;
    bar.className='eventBar'+(live?' live':'');
  }
  function renderFight(){
    var box=$('fight');
    if(!game){box.hidden=true;return;}
    var f=game.fight||{};
    if(f.on){
      var mo=monsterFor(f.s), st=stats();
      var pm=Math.max(0,Math.min(100,Math.round(f.m/mo.hp*100))), pp=Math.max(0,Math.min(100,Math.round(f.p/st.hp*100)));
      box.hidden=false;
      box.innerHTML='<div class="fhead"><div class="mon">'+monsterSvg(mo.id)+'</div><div style="flex:1;min-width:0"><div class="rn">'+mo.name+'</div><div class="rd">Бьёшь, если выпало: '+mo.rule+'. Зеро и остальное: монстр бьёт тебя.</div></div></div>'
        +'<div><div class="hpl"><span>'+mo.name+'</span><span>'+f.m+' / '+mo.hp+'</span></div><div class="bar m"><i style="width:'+pm+'%"></i></div></div>'
        +'<div><div class="hpl"><span>Ты</span><span>'+f.p+' / '+st.hp+'</span></div><div class="bar p"><i style="width:'+pp+'%"></i></div></div>'
        +'<div class="flog">'+fightLog+'</div>';
    }else if(fightMsg){
      box.hidden=false;
      box.innerHTML='<div class="flog">'+fightMsg+'</div><button id="fClose" class="ghost">Закрыть</button>';
      $('fClose').addEventListener('click',function(){fightMsg=''; renderFight();});
    }else{
      box.hidden=true;
    }
  }
  function startFight(){
    if(!game) return;
    var slot=slotNow(), el=Date.now()-slot*HOUR, f=game.fight;
    if(el>=EVENT_MS||f.on||f.s===slot) return;
    var mo=monsterFor(slot), st=stats();
    game.fight={s:slot,m:mo.hp,p:st.hp,on:true};
    fightLog='Бой начался. Крути колесо!'; fightMsg='';
    saveGame(); renderFight(); renderEvent();
  }
  function loseFight(prefix){
    var lost=Math.floor((Number(game.coins)||0)*LOSE_SHARE);
    game.coins-=lost; game.fight.on=false;
    fightMsg=prefix+' Потеряно 70% монет: −'+lost+'.';
    renderCoins();
  }
  function fightStrike(n){
    var f=game&&game.fight; if(!f||!f.on) return;
    var mo=monsterFor(f.s), st=stats();
    if(mo.hit(n)){
      f.m-=st.atk; fightLog='Выпало '+n+': попал! '+mo.name+' теряет '+st.atk+' HP.';
    }else{
      f.p-=mo.dmg; fightLog='Выпало '+n+': промах. '+mo.name+' бьёт на '+mo.dmg+'.';
    }
    if(f.m<=0){
      f.m=0; f.on=false;
      var rew=WIN_MIN+Math.floor(Math.random()*(WIN_MAX-WIN_MIN+1));
      game.coins+=rew; fightMsg=fightLog+' Победа! Награда: '+rew+' монет.';
      renderCoins();
    }else if(f.p<=0){
      f.p=0; loseFight(fightLog+' Ты погиб.');
    }
  }
  // если бой не закончен, а час уже сменился, это считается поражением
  function checkAbandon(){
    var f=game&&game.fight;
    if(f&&f.on&&f.s!==slotNow()){ loseFight('Бой не был закончен, монстр победил.'); saveGame(); renderFight(); renderEvent(); }
  }
  $('evBtn').addEventListener('click',function(){
    var mo=monsterFor(slotNow());
    confirmBox('Начать бой с монстром «'+mo.name+'»? Если погибнешь, потеряешь 70% монет. За победу дают от '+WIN_MIN+' до '+WIN_MAX+' монет.','В бой',startFight);
  });
  setInterval(function(){ if(game){checkAbandon();} renderEvent(); },1000);

  /* ---------- лидерборд ---------- */
  var curTab='game';
  function loadBoard(){
    var box=$('board');
    token().then(function(t){
      return fetch(DB_URL+'/users.json?orderBy=%22game%2Fspins%22&limitToLast=20&auth='+encodeURIComponent(t));
    }).then(function(r){return r.json();}).then(function(obj){
      if(!obj||obj.error){ box.innerHTML=''; var e=document.createElement('div'); e.className='bempty'; e.textContent='Не удалось загрузить рейтинг. Проверь правила в Firebase.'; box.appendChild(e); return; }
      var rows=Object.keys(obj).map(function(k){
        var u=obj[k]||{}, g=u.game||{};
        return {uid:k,name:u.name||'Игрок',spins:Number(g.spins)||0,title:g.title,race:g.race,cls:g.cls};
      }).filter(function(x){return x.spins>0;}).sort(function(x,y){return y.spins-x.spins;});
      box.innerHTML='';
      if(!rows.length){var e2=document.createElement('div'); e2.className='bempty'; e2.textContent='Пока никто не крутил колесо.'; box.appendChild(e2); return;}
      rows.forEach(function(x,i){
        var row=document.createElement('div'); row.className='brow'+((sess&&x.uid===sess.uid)?' me':'');
        var rk=document.createElement('div'); rk.className='rk'+(i<3?' top':''); rk.textContent=String(i+1);
        var av=document.createElement('span'); av.className='av'; av.innerHTML=avatar(x.uid,x.title,x.race,x.cls);
        var nm=document.createElement('div'); nm.className='bn'; nm.textContent=x.name;
        var tn=titleName(x.title);
        if(tn){var tt=document.createElement('span'); tt.className='tt'; tt.textContent=tn; nm.appendChild(tt);}
        var sc=document.createElement('div'); sc.className='bs'; sc.appendChild(document.createTextNode(String(x.spins)+' '));
        var sm=document.createElement('small'); sm.textContent='прокр.'; sc.appendChild(sm);
        row.appendChild(rk); row.appendChild(av); row.appendChild(nm); row.appendChild(sc);
        box.appendChild(row);
      });
    }).catch(function(){});
  }
  setInterval(function(){ if(curTab==='board'&&!document.hidden) loadBoard(); },15000);
  function showTab(which){
    curTab=which;
    $('gamePane').hidden=(which!=='game'); $('charPane').hidden=(which!=='char'); $('boardPane').hidden=(which!=='board'); $('shopPane').hidden=(which!=='shop');
    $('tabGame').className='tab'+(which==='game'?' on':'');
    $('tabChar').className='tab'+(which==='char'?' on':'');
    $('tabBoard').className='tab'+(which==='board'?' on':'');
    $('tabShop').className='tab'+(which==='shop'?' on':'');
    if(which==='game') draw();
    if(which==='char'){$('dot').hidden=true; renderChar();}
    if(which==='board') loadBoard();
    if(which==='shop') renderShop();
  }
  $('tabGame').addEventListener('click',function(){showTab('game');});
  $('tabChar').addEventListener('click',function(){showTab('char');});
  $('tabBoard').addEventListener('click',function(){showTab('board');});
  $('tabShop').addEventListener('click',function(){showTab('shop');});
  $('boardRefresh').addEventListener('click',loadBoard);

  function gearOf(cls){var c=CLASSES[cls];return c?c.gear:{};}
  function itemIcon(id){var it=ITEMS[id];return '<svg viewBox="'+it.vb+'" aria-hidden="true">'+it.draw+'</svg>';}
  function stats(){
    var hp=100, atk=5, g=gearOf(game&&game.cls);
    for(var sl in g){var it=ITEMS[g[sl]]; if(it){hp+=it.hp||0; atk+=it.atk||0;}}
    return {hp:hp,atk:atk};
  }

  function hashStr(str){var h=2166136261;for(var i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return h>>>0;}
  function rng(seed){var a=seed>>>0;return function(){a=(a+0x6D2B79F5)|0;var t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
  function pick(r,arr){return arr[Math.floor(r()*arr.length)];}
  function look(seed,race,cls){
    var r=rng(hashStr(String(seed||'x')));
    var L={skin:pick(r,SKIN),hair:pick(r,HAIR),shirt:pick(r,SHIRT),bg:pick(r,BGS)};
    L.hs=Math.floor(r()*5); L.es=Math.floor(r()*3); L.ms=Math.floor(r()*3); L.cheeks=r()<0.5;
    L.pants=pick(r,PANTS); L.shoe=pick(r,SHOES); L.ts=Math.floor(r()*3);
    L.race=race||'human';
    if(L.race==='orc') L.skin='#86b86b';
    var g=gearOf(cls); L.hat=g.head||''; L.hand=g.arms||'';
    return L;
  }
  // голова с причёской, лицом, чертами расы, шапкой класса и украшением титула (область 100x100)
  function headParts(L,titleId){
    var s='', hs=L.hs, es=L.es, ms=L.ms, hair=L.hair, skin=L.skin, rc=L.race;
    if(L.hat) titleId='';
    if(hs===3) s+='<path d="M22 50 C20 18 80 18 78 50 L80 82 L66 80 L34 80 L20 82Z" fill="'+hair+'" '+OUT+'/>';
    if(rc==='elf'){
      s+='<path d="M27 47 L7 35 L25 61Z" fill="'+skin+'" '+OUT+'/><path d="M73 47 L93 35 L75 61Z" fill="'+skin+'" '+OUT+'/>';
    }else if(rc!=='beast'){
      s+='<circle cx="24.5" cy="54" r="5" fill="'+skin+'" '+OUT+'/><circle cx="75.5" cy="54" r="5" fill="'+skin+'" '+OUT+'/>';
    }
    s+='<ellipse cx="50" cy="52" rx="26" ry="27" fill="'+skin+'" '+OUT+'/>';
    if(hs===0) s+='<path d="M50 26 Q44 18 52 14" fill="none" stroke="'+hair+'" stroke-width="3.5" stroke-linecap="round"/>';
    if(hs===1) s+='<path d="M24 48 C22 26 38 20 50 20 C62 20 78 26 76 48 C70 38 60 34 50 34 C40 34 30 38 24 48Z" fill="'+hair+'" '+OUT+'/>';
    if(hs===2) s+='<polygon points="24,46 26,28 34,36 38,20 46,32 52,18 58,32 66,20 68,36 76,28 76,46 66,36 50,33 34,36" fill="'+hair+'" '+OUT+'/>';
    if(hs===3) s+='<path d="M26 44 C30 28 70 28 74 44 C64 36 36 36 26 44Z" fill="'+hair+'" '+OUT+'/>';
    if(hs===4) s+='<polygon points="42,30 44,12 50,22 56,12 58,30" fill="'+hair+'" '+OUT+'/>';
    if(rc==='beast'){
      s+='<path d="M27 36 L30 9 L45 26Z" fill="'+hair+'" '+OUT+'/><path d="M31 28 L32 16 L40 25Z" fill="#ff9fb0"/>'
        +'<path d="M73 36 L70 9 L55 26Z" fill="'+hair+'" '+OUT+'/><path d="M69 28 L68 16 L60 25Z" fill="#ff9fb0"/>';
    }
    if(rc==='drake'){
      s+='<path d="M33 30 Q21 14 31 5 Q31 18 43 26Z" fill="#f2e3b3" '+OUT+'/><path d="M67 30 Q79 14 69 5 Q69 18 57 26Z" fill="#f2e3b3" '+OUT+'/>';
    }
    if(L.hat) s+=ITEMS[L.hat].draw;
    if(L.cheeks) s+='<circle cx="32" cy="62" r="4.5" fill="#ff8fa3" opacity="0.6"/><circle cx="68" cy="62" r="4.5" fill="#ff8fa3" opacity="0.6"/>';
    if(rc==='beast') s+='<path d="M26 60 L11 57 M26 64 L11 66 M74 60 L89 57 M74 64 L89 66" fill="none" stroke="'+INK+'" stroke-width="1.6" stroke-linecap="round"/>';
    if(rc==='dwarf') s+='<path d="M26 60 C25 94 75 94 74 60 C70 72 60 70 50 70 C40 70 30 72 26 60Z" fill="'+BEARD[(hs+es)%4]+'" '+OUT+'/>';
    s+='<g class="eyes">';
    if(es===0) s+='<circle cx="40" cy="52" r="3" fill="'+INK+'"/><circle cx="60" cy="52" r="3" fill="'+INK+'"/>';
    if(es===1) s+='<circle cx="40" cy="51" r="6" fill="#fff" stroke="'+INK+'" stroke-width="2"/><circle cx="41" cy="52" r="3" fill="'+INK+'"/><circle cx="60" cy="51" r="6" fill="#fff" stroke="'+INK+'" stroke-width="2"/><circle cx="61" cy="52" r="3" fill="'+INK+'"/>';
    if(es===2) s+='<path d="M34 52 q6 5 12 0 M54 52 q6 5 12 0" fill="none" '+OUT+'/>';
    s+='</g>';
    if(ms===0) s+='<path d="M42 64 Q50 73 58 64" fill="none" '+OUT+'/>';
    if(ms===1) s+='<path d="M42 63 Q50 77 58 63Z" fill="#8f2d2d" '+OUT+'/>';
    if(ms===2) s+='<path d="M43 67 Q50 68 58 62" fill="none" '+OUT+'/>';
    if(rc==='orc') s+='<path d="M41 70 L43 62 L46 70Z" fill="#fff" stroke="'+INK+'" stroke-width="1.6" stroke-linejoin="round"/><path d="M59 70 L57 62 L54 70Z" fill="#fff" stroke="'+INK+'" stroke-width="1.6" stroke-linejoin="round"/>';
    s+='<g class="deco">';
    if(titleId==='newbie'){
      s+='<path d="M50 27 L50 15" fill="none" stroke="#3b8f3b" stroke-width="3" stroke-linecap="round"/>'
        +'<ellipse cx="43" cy="13" rx="7" ry="4" transform="rotate(-25 43 13)" fill="#6bbf59" '+OUT+'/>'
        +'<ellipse cx="57" cy="13" rx="7" ry="4" transform="rotate(25 57 13)" fill="#6bbf59" '+OUT+'/>';
    }
    if(titleId==='luck'){
      s+='<path d="M34 28 L36 12 L43 20 L50 8 L57 20 L64 12 L66 28Z" fill="#f6c343" '+OUT+'/><circle cx="50" cy="21" r="2.6" fill="#e63946"/>';
    }
    if(titleId==='unlucky'){
      s+='<g fill="#aab4c0"><ellipse cx="38" cy="15" rx="12" ry="8"/><ellipse cx="52" cy="12" rx="12" ry="9"/><ellipse cx="64" cy="17" rx="9" ry="6"/></g>'
        +'<path d="M40 26 l-2 6 M52 26 l-2 6 M63 26 l-2 6" stroke="#4a90d9" stroke-width="2.6" stroke-linecap="round"/>';
    }
    if(titleId==='bum'){
      s+='<path d="M25 42 C24 18 76 18 75 42Z" fill="#6e5a46" '+OUT+'/><path d="M21 42 L80 42" stroke="'+INK+'" stroke-width="3" stroke-linecap="round"/>'
        +'<rect x="55" y="25" width="9" height="9" rx="1.5" transform="rotate(12 59 29)" fill="#c58f5a" stroke="'+INK+'" stroke-width="1.5"/>'
        +'<g fill="'+INK+'" opacity="0.55"><circle cx="40" cy="74" r="1.3"/><circle cx="46" cy="76" r="1.3"/><circle cx="54" cy="76" r="1.3"/><circle cx="60" cy="74" r="1.3"/><circle cx="35" cy="70" r="1.3"/><circle cx="65" cy="70" r="1.3"/></g>';
    }
    if(titleId==='hen'){
      s+='<path d="M38 20 q-7 -3 -5 -9 q6 0 9 6Z" fill="#fff" '+OUT+'/>'
        +'<ellipse cx="50" cy="22" rx="13" ry="9" fill="#fff" '+OUT+'/>'
        +'<path d="M46 14 q1 -8 4 -2 q2 -6 4 2Z" fill="#e63946" '+OUT+'/>'
        +'<path d="M62 21 l7 2 l-7 3Z" fill="#f4a300" '+OUT+'/><circle cx="57" cy="19" r="1.7" fill="'+INK+'"/>';
    }
    return s+'</g>';
  }
  // маленький портрет для чата и рейтинга: голова и плечи
  function avatar(seed,titleId,race,cls){
    var L=look(seed,race,cls);
    return '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">'
      +'<rect width="100" height="100" fill="'+L.bg+'"/>'
      +'<path d="M14 100 C16 78 32 74 50 74 C68 74 84 78 86 100Z" fill="'+L.shirt+'" '+OUT+'/>'
      +headParts(L,titleId)+'</svg>';
  }
  // персонаж в полный рост с анимацией
  function avatarBody(seed,titleId,race,cls){
    var L=look(seed,race,cls), sk=L.skin, rc=L.race;
    var wp=L.hand?ITEMS[L.hand]:null;
    var wL=(wp&&wp.hand==='L')?wp.draw:'', wR=(wp&&wp.hand==='R')?wp.draw:'';
    var s='<svg class="chr" viewBox="0 0 144 144" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">';
    s+='<rect width="144" height="144" rx="24" fill="'+L.bg+'" opacity="0.65"/><g transform="translate(22 0)">';
    if(rc==='dwarf') s+='<g transform="translate(50 138) scale(0.84) translate(-50 -138)">';
    s+='<ellipse class="sh" cx="50" cy="138" rx="24" ry="4" fill="#000" opacity="0.18"/>';
    s+='<g class="chrBob">';
    if(rc==='beast'||rc==='drake'){
      var tc=(rc==='beast')?L.hair:'#5aa469';
      s+='<g class="tail"><path d="M63 104 Q90 104 88 80" fill="none" stroke="'+INK+'" stroke-width="9" stroke-linecap="round"/><path d="M63 104 Q90 104 88 80" fill="none" stroke="'+tc+'" stroke-width="5" stroke-linecap="round"/>';
      if(rc==='drake') s+='<path d="M88 71 L83 82 L93 82Z" fill="#f2c94c" stroke="'+INK+'" stroke-width="1.8" stroke-linejoin="round"/>';
      s+='</g>';
    }
    s+='<g class="legL"><rect x="37" y="106" width="10" height="22" rx="4" fill="'+L.pants+'" '+OUT+'/><ellipse cx="40" cy="130" rx="9" ry="5" fill="'+L.shoe+'" '+OUT+'/></g>';
    s+='<g class="legR"><rect x="53" y="106" width="10" height="22" rx="4" fill="'+L.pants+'" '+OUT+'/><ellipse cx="60" cy="130" rx="9" ry="5" fill="'+L.shoe+'" '+OUT+'/></g>';
    s+='<path d="M36 82 Q50 77 64 82 L65 108 Q50 112 35 108Z" fill="'+L.shirt+'" '+OUT+'/>';
    if(L.ts===1) s+='<path d="M36.5 94 H63.5 M36 101 H64" stroke="#fff" stroke-width="3" opacity="0.55"/>';
    if(L.ts===2) s+='<circle cx="50" cy="96" r="5" fill="#fff" opacity="0.75"/>';
    s+='<g class="armL"><path d="M37 86 Q25 94 23 107" fill="none" stroke="'+INK+'" stroke-width="9" stroke-linecap="round"/><path d="M37 86 Q25 94 23 107" fill="none" stroke="'+sk+'" stroke-width="4.5" stroke-linecap="round"/>'+wL+'<circle cx="23" cy="108" r="4.6" fill="'+sk+'" '+OUT+'/></g>';
    s+='<g class="armR"><path d="M63 86 Q75 94 77 107" fill="none" stroke="'+INK+'" stroke-width="9" stroke-linecap="round"/><path d="M63 86 Q75 94 77 107" fill="none" stroke="'+sk+'" stroke-width="4.5" stroke-linecap="round"/>'+wR+'<circle cx="77" cy="108" r="4.6" fill="'+sk+'" '+OUT+'/></g>';
    s+='<g class="chead"><g transform="translate(50 52) scale(1.1) translate(-50 -52)">'+headParts(L,titleId)+'</g></g>';
    s+='</g>';
    if(rc==='dwarf') s+='</g>';
    return s+'</g></svg>';
  }

  /* ---------- колесо ---------- */
  var canvas=$('wheel'), ctx=canvas.getContext('2d');
  var numEl=$('num'), labelEl=$('label'), btn=$('spin');
  var rot=0, spinning=false;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(){
    var size=canvas.clientWidth; if(!size) return;
    var dpr=window.devicePixelRatio||1;
    if(canvas.width!==Math.round(size*dpr)){canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr);}
    var s=canvas.width, r=s/2;
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,s,s); ctx.translate(r,r);
    for(var i=0;i<N;i++){
      var a=-Math.PI/2+i*SEG+rot;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,a-SEG/2,a+SEG/2); ctx.closePath();
      ctx.fillStyle=FILL[color(ORDER[i])]; ctx.fill();
      ctx.strokeStyle='rgba(224,181,80,.55)'; ctx.lineWidth=Math.max(1,s/400); ctx.stroke();
      ctx.save(); ctx.rotate(a); ctx.translate(r*0.86,0); ctx.rotate(Math.PI/2);
      ctx.fillStyle='#fff'; ctx.font='700 '+Math.round(s*0.046)+'px Manrope,system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(ORDER[i]),0,0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,r*0.62,0,TAU); ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,r*0.5,0,TAU); ctx.fillStyle='#1f5a3f'; ctx.fill();
    ctx.lineWidth=Math.max(2,s/160); ctx.strokeStyle='#b8892f'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*0.09,0,TAU); ctx.fillStyle='#b8892f'; ctx.fill();
  }
  function ease(t){return 1-Math.pow(1-t,4);}

  function show(n){
    var c=color(n);
    numEl.textContent=n; numEl.className='num '+c;
    labelEl.textContent=c==='green'?'Зеро':(c==='red'?'Красное':'Чёрное');
    onSpin(n);
  }
  function spin(){
    if(spinning) return;
    spinning=true; btn.disabled=true; labelEl.textContent='Крутится…';
    var k=Math.floor(Math.random()*N), jitter=(Math.random()-.5)*SEG*0.7, start=rot;
    var base=((-k*SEG+jitter)-start)%TAU; if(base<0) base+=TAU;
    var target=start+(5+Math.floor(Math.random()*3))*TAU+base;
    var dur=reduce?300:5200, t0=performance.now();
    function frame(now){
      var t=Math.min(1,(now-t0)/dur);
      rot=start+(target-start)*ease(t); draw();
      if(t<1) requestAnimationFrame(frame);
      else{rot=target; spinning=false; btn.disabled=false; show(ORDER[k]);}
    }
    requestAnimationFrame(frame);
  }
  btn.addEventListener('click',spin);
  window.addEventListener('resize',draw);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);

  /* ---------- чат (Firebase Realtime Database через обычные запросы) ---------- */
  // Адрес базы (Realtime Database -> Data), без слэша в конце:
  var CFG=window.ROULETTE_CONFIG||{};
  var DB_URL=CFG.DB_URL||'https://flamer-b1592-default-rtdb.firebaseio.com';
  // Web API Key (Project settings -> General):
  var API_KEY=CFG.API_KEY||'ВСТАВЬ-API-KEY';

  var msgsEl=$('msgs'), msgIn=$('msgIn'), sendBtn=$('send'), noteEl=$('chatNote');
  var docs=[], lastSig='';
  function configured(){return DB_URL.indexOf('ВАШ-ПРОЕКТ')===-1 && API_KEY.indexOf('ВСТАВЬ')===-1;}
  var chatReady=configured();

  function renderChat(){
    msgsEl.innerHTML='';
    if(!docs.length){
      var e=document.createElement('div'); e.className='empty';
      e.textContent=chatReady?'Сообщений пока нет. Напиши первым.':'Чат не настроен: впиши API_KEY в файл config.js.';
      msgsEl.appendChild(e); return;
    }
    docs.forEach(function(m){
      var d=document.createElement('div');
      if(m.kind==='title'){
        d.className='titleLine';
        d.appendChild(document.createTextNode(String(m.name||'Игрок')+' получил титул «'+String(m.tn||'')+'»'));
      }else{
        d.className='msg'+(m.uid===uid?' mine':'');
        var w=document.createElement('div'); w.className='who'; w.textContent=String(m.name||'Игрок');
        var tn=titleName(m.title);
        if(tn){var tt=document.createElement('span'); tt.className='tt'; tt.textContent=tn; w.appendChild(tt);}
        var t=document.createElement('div'); t.textContent=String(m.text||'');
        var av=document.createElement('span'); av.className='av'; av.innerHTML=avatar(m.uid,m.title,m.race,m.cls);
        var bd=document.createElement('div'); bd.className='body'; bd.appendChild(w); bd.appendChild(t);
        d.appendChild(av); d.appendChild(bd);
      }
      msgsEl.appendChild(d);
    });
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }

  function load(){
    if(!chatReady||!sess||!sess.name||document.hidden) return;
    token().then(function(t){
      return fetch(DB_URL+'/chat.json?orderBy=%22%24key%22&limitToLast=100&auth='+encodeURIComponent(t));
    }).then(function(r){return r.json();}).then(function(obj){
      if(!obj||obj.error){ if(obj&&obj.error){noteEl.textContent='Нет доступа к чату: проверь правила в Firebase';} return; }
      var keys=Object.keys(obj).sort();
      var sig=keys.length+':'+keys[keys.length-1];
      if(sig===lastSig) return;
      lastSig=sig;
      docs=keys.map(function(k){return obj[k];}).filter(function(m){return m&&m.kind!=='spin';});
      renderChat();
    }).catch(function(){});
  }

  function post(fields){
    if(!chatReady||!sess||!sess.name) return Promise.resolve();
    var body={name:sess.name,uid:sess.uid,t:Date.now(),title:(game&&game.title)||'newbie',race:(game&&game.race)||'human',cls:(game&&game.cls)||''};
    for(var k in fields) body[k]=fields[k];
    return token().then(function(t){
      return fetch(DB_URL+'/chat.json?auth='+encodeURIComponent(t),{method:'POST',body:JSON.stringify(body)});
    }).then(function(r){ if(!r.ok) throw new Error('bad'); noteEl.textContent=''; load(); })
      .catch(function(){noteEl.textContent='Не удалось отправить. Проверь правила в Firebase и войди заново.';});
  }
  function sendMsg(){
    var v=msgIn.value.trim(); if(!v||!chatReady) return;
    msgIn.value=''; post({kind:'msg',text:v.slice(0,300)});
  }
  sendBtn.addEventListener('click',sendMsg);
  msgIn.addEventListener('keydown',function(e){if(e.key==='Enter') sendMsg();});

  renderChat();
  setInterval(load,2500);
  document.addEventListener('visibilitychange',load);
  restore();
})();
</script>
