<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Рулетка с чатом</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Manrope:wght@500;700&display=swap">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#efe9dc; --felt:#1f5a3f; --ink:#1b1b18; --muted:#6b675c;
  --card:#fbf8f1; --line:#d8d0bd; --gold:#b8892f; --red:#b3261e; --black:#1a1a1a; --green:#1f7a4d;
  --mine:#e7dcc0;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10231a; --felt:#0c1a13; --ink:#f1ecde; --muted:#9db3a5;
    --card:#17301f; --line:#2b4a38; --gold:#e0b550; --mine:#24472f; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10231a; --felt:#0c1a13; --ink:#f1ecde; --muted:#9db3a5;
  --card:#17301f; --line:#2b4a38; --gold:#e0b550; --mine:#24472f; color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; background:var(--bg); color:var(--ink);
  font-family:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding:24px 16px 40px;
}
[hidden]{display:none!important}
h1{font-family:'DM Serif Display',Georgia,'Times New Roman',serif;font-weight:400;font-size:clamp(34px,8vw,52px);margin:0;letter-spacing:.01em}
button,input{font:inherit}
button{font-weight:700;cursor:pointer;border:0;border-radius:999px;background:var(--gold);color:#1b1405;padding:12px 30px;font-size:17px}
button:hover:not(:disabled){filter:brightness(1.06)}
button:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
input{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:12px 14px;font-size:16px;min-width:0}

/* вход */
#login{max-width:380px;margin:12vh auto 0;display:flex;flex-direction:column;gap:16px;align-items:stretch;text-align:center}
#login p{margin:0;color:var(--muted)}
#login input{text-align:center;font-size:18px}
.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.chatHead button{padding:4px 12px;font-size:13px;flex:none}
#loginErr{min-height:20px;color:var(--red);font-size:14px}

/* основной экран */
.layout{display:grid;grid-template-columns:minmax(260px,340px) 1fr;gap:28px;width:min(1080px,100%);margin:0 auto;align-items:start}
.wheelCol{display:flex;flex-direction:column;align-items:center;gap:20px}
.stage{position:relative;width:min(88vw,420px);aspect-ratio:1;margin-top:18px}
canvas{width:100%;height:100%;display:block;border-radius:50%;box-shadow:0 0 0 10px var(--felt),0 0 0 12px var(--gold),0 14px 34px rgba(0,0,0,.28)}
.pointer{position:absolute;left:50%;top:-16px;width:0;height:0;transform:translateX(-50%);border-left:13px solid transparent;border-right:13px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 2px 2px rgba(0,0,0,.4));z-index:2}
.result{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:124px;justify-content:center}
.num{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(72px,20vw,100px);line-height:1;min-width:2ch;text-align:center;padding:0 .25em;border-radius:18px;color:#fff;background:var(--muted);transition:background .25s}
.red{background:var(--red)} .black{background:var(--black)} .green{background:var(--green)}
.label{color:var(--muted);font-size:15px;min-height:22px}

/* вкладки и персонаж */
.rightCol{display:flex;flex-direction:column;gap:18px;align-items:center;min-width:0}
.tabs{display:flex;gap:8px;justify-content:center}
.tab{background:transparent;color:var(--ink);border:1px solid var(--line);padding:8px 22px;font-size:16px}
.tab.on{background:var(--gold);color:#1b1405;border-color:var(--gold)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--red);margin-left:8px;vertical-align:middle}
#toast{min-height:34px}
#toast.on{background:var(--gold);color:#1b1405;font-weight:700;padding:6px 16px;border-radius:999px;text-align:center}
.charPane{display:flex;flex-direction:column;align-items:center;gap:18px;width:100%;max-width:520px}
.hero{text-align:center}
.hero .name{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(30px,7vw,40px)}
.hero .cur{display:inline-block;margin-top:6px;padding:6px 20px;border-radius:999px;background:var(--gold);color:#1b1405;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px}
.stat span{font-size:12px;color:var(--muted)}
.tlist{display:flex;flex-direction:column;gap:10px;width:100%}
.titem{display:flex;justify-content:space-between;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.titem.locked{opacity:.6}
.titem .tn{font-weight:700}
.titem .td{font-size:13px;color:var(--muted)}
.titem button{padding:6px 16px;font-size:14px;flex:none}
.titem .lock{font-size:13px;color:var(--muted);flex:none}
.tt{font-size:11px;font-weight:700;margin-left:6px;padding:1px 7px;border-radius:999px;background:var(--gold);color:#1b1405}

/* чат */
.chat{display:flex;flex-direction:column;background:var(--card);border:1px solid var(--line);border-radius:18px;height:min(72vh,600px);overflow:hidden}
.chatHead{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.chatHead b{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:22px}
.chatHead span{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#msgs{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.msg{max-width:92%;padding:8px 12px;border-radius:14px;background:var(--bg);align-self:flex-start;overflow-wrap:anywhere}
.msg.mine{background:var(--mine);align-self:flex-end}
.msg .who{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}
.spinLine{align-self:center;font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;text-align:center}
.chip{min-width:30px;padding:2px 8px;border-radius:8px;color:#fff;font-weight:700;font-size:13px;text-align:center}
.empty{margin:auto;color:var(--muted);font-size:14px;text-align:center}
.chatForm{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chatForm input{flex:1}
.chatForm button{padding:10px 18px;font-size:16px}
#chatNote{padding:0 12px 10px;color:var(--red);font-size:13px;min-height:0}

@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .rightCol{order:-1}
  .chat{height:420px}
}
</style>
</head>
<body>

<div id="login">
  <h1>Рулетка</h1>
  <p>Войди или создай аккаунт</p>
  <input id="nick" maxlength="15" autocomplete="username" placeholder="Имя" aria-label="Имя">
  <input id="pass" type="password" maxlength="64" autocomplete="current-password" placeholder="Пароль (от 6 символов)" aria-label="Пароль">
  <div id="loginErr" aria-live="polite"></div>
  <button id="enter">Войти</button>
  <button id="signup" class="ghost">Создать аккаунт</button>
</div>

<div id="app" hidden>
  <div class="layout">
    <section class="chat" aria-label="Чат">
      <div class="chatHead"><b>Чат</b><span id="me"></span><button id="logout" class="ghost">Выйти</button></div>
      <div id="msgs" aria-live="polite"></div>
      <div id="chatNote"></div>
      <div class="chatForm">
        <input id="msgIn" maxlength="300" placeholder="Напиши сообщение" aria-label="Сообщение" autocomplete="off">
        <button id="send">Отправить</button>
      </div>
    </section>

    <div class="rightCol">
    <div class="tabs">
      <button id="tabGame" class="tab on">Рулетка</button>
      <button id="tabChar" class="tab">Персонаж<span id="dot" class="dot" hidden></span></button>
    </div>
    <section class="wheelCol" id="gamePane">
      <h1>Рулетка</h1>
      <div class="stage">
        <div class="pointer"></div>
        <canvas id="wheel" aria-label="Колесо рулетки"></canvas>
      </div>
      <div class="result" aria-live="polite">
        <div class="num" id="num">?</div>
        <div class="label" id="label">Нажми «Крутить»</div>
      </div>
      <div id="toast" aria-live="polite"></div>
      <button id="spin">Крутить</button>
    </section>

    <section class="charPane" id="charPane" hidden>
      <div class="hero"><div class="name" id="charName"></div><div class="cur" id="charTitle"></div></div>
      <div class="stats">
        <div class="stat"><b id="stSpins">0</b><span>Прокруток</span></div>
        <div class="stat"><b id="stRed">0</b><span>Красное</span></div>
        <div class="stat"><b id="stBlack">0</b><span>Чёрное</span></div>
        <div class="stat"><b id="stZero">0</b><span>Зеро</span></div>
      </div>
      <div class="tlist" id="tlist"></div>
    </section>
    </div>
  </div>
</div>

<script>
(function(){
  var ORDER=[0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  var REDS=[1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
  var N=ORDER.length, SEG=2*Math.PI/N, TAU=2*Math.PI;
  function $(id){return document.getElementById(id);}
  function color(n){return n===0?'green':(REDS.indexOf(n)>-1?'red':'black');}
  var FILL={green:'#1f7a4d',red:'#b3261e',black:'#1a1a1a'};
  var nick='', uid='', game=null;

  /* ---------- аккаунты (Firebase Authentication через обычные запросы) ---------- */
  var sess=null;
  var nickIn=$('nick'), passIn=$('pass'), errEl=$('loginErr');
  function setErr(t){errEl.textContent=t||'';}
  function setBusy(v){$('enter').disabled=v; $('signup').disabled=v;}
  function persist(){try{localStorage.setItem('roulette_sess',JSON.stringify({refreshToken:sess.refreshToken}));}catch(e){}}
  // Firebase входит по почте, поэтому из имени делаем служебный адрес (имя кодируется в hex)
  function emailFor(name){
    var bytes=new TextEncoder().encode(name.toLowerCase()), h='u';
    bytes.forEach(function(x){h+=('0'+x.toString(16)).slice(-2);});
    return h+'@roulette.example.com';
  }
  function msgFor(c){
    if(c.indexOf('EMAIL_EXISTS')>-1) return 'Такое имя уже занято';
    if(/INVALID_LOGIN_CREDENTIALS|EMAIL_NOT_FOUND|INVALID_PASSWORD/.test(c)) return 'Неверное имя или пароль';
    if(c.indexOf('WEAK_PASSWORD')>-1) return 'Пароль слишком простой: минимум 6 символов';
    if(c.indexOf('OPERATION_NOT_ALLOWED')>-1) return 'В Firebase не включён вход по почте и паролю';
    if(/API_KEY|API key/i.test(c)) return 'Неверный API-ключ в файле';
    if(c.indexOf('TOO_MANY_ATTEMPTS')>-1) return 'Слишком много попыток, подожди немного';
    if(c.indexOf('PROFILE_WRITE')>-1) return 'Не удалось сохранить профиль: проверь правила в Firebase';
    if(c.indexOf('fetch')>-1) return 'Не удалось связаться с сервером';
    return 'Ошибка: '+c;
  }
  function authCall(path,body){
    return fetch('https://identitytoolkit.googleapis.com/v1/accounts:'+path+'?key='+encodeURIComponent(API_KEY),
      {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})
      .then(function(r){return r.json();});
  }
  function refresh(){
    return fetch('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(API_KEY),
      {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
       body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(sess.refreshToken)})
      .then(function(r){return r.json();})
      .then(function(d){
        if(d.error) throw (d.error.message||'REFRESH');
        sess.idToken=d.id_token; sess.refreshToken=d.refresh_token; sess.uid=d.user_id;
        sess.exp=Date.now()+(Number(d.expires_in)||3600)*1000; persist(); return sess.idToken;
      });
  }
  function token(){
    if(!sess) return Promise.reject('NO_SESSION');
    if(sess.idToken&&Date.now()<sess.exp-60000) return Promise.resolve(sess.idToken);
    return refresh();
  }
  // имя профиля хранится в базе, так его нельзя подделать в чате (проверяют правила)
  function ensureProfile(typed){
    return token().then(function(t){
      var url=DB_URL+'/users/'+sess.uid;
      return fetch(url+'/name.json?auth='+encodeURIComponent(t)).then(function(r){return r.json();}).then(function(v){
        if(typeof v==='string') return v;
        if(!typed) throw 'NO_PROFILE';
        return fetch(url+'/name.json?auth='+encodeURIComponent(t),{method:'PUT',body:JSON.stringify(typed)})
          .then(function(r){ if(!r.ok) throw 'PROFILE_WRITE'; return typed; });
      });
    });
  }
  function submit(mode){
    setErr('');
    if(!configured()){setErr('В файле не заполнены DB_URL и API_KEY');return;}
    var name=nickIn.value.replace(/\s+/g,' ').trim(), pass=passIn.value;
    if(name.length<2||name.length>15){setErr('Имя: от 2 до 15 символов');return;}
    if(pass.length<6){setErr('Пароль: не короче 6 символов');return;}
    setBusy(true);
    authCall(mode==='signUp'?'signUp':'signInWithPassword',{email:emailFor(name),password:pass,returnSecureToken:true})
      .then(function(d){
        if(d.error) throw (d.error.message||'ERROR');
        sess={uid:d.localId,idToken:d.idToken,refreshToken:d.refreshToken,exp:Date.now()+(Number(d.expiresIn)||3600)*1000};
        persist(); return ensureProfile(name);
      })
      .then(function(n){ sess.name=n; start(); })
      .catch(function(e){ sess=null; setErr(msgFor(String(e))); })
      .then(function(){ setBusy(false); });
  }
  function start(){
    uid=sess.uid; nick=sess.name;
    $('login').hidden=true; $('app').hidden=false; $('me').textContent='ты: '+nick; passIn.value='';
    game=null; showTab('game'); draw(); lastSig=''; renderChat(); load(); loadGame();
  }
  function logout(){
    sess=null; game=null; docs=[]; lastSig='';
    try{localStorage.removeItem('roulette_sess');}catch(e){}
    $('app').hidden=true; $('login').hidden=false; setErr('');
  }
  function restore(){
    var s=null; try{s=JSON.parse(localStorage.getItem('roulette_sess')||'null');}catch(e){}
    if(!s||!s.refreshToken||!configured()) return;
    sess={refreshToken:s.refreshToken,exp:0}; setBusy(true);
    refresh().then(function(){return ensureProfile(null);})
      .then(function(n){ sess.name=n; start(); })
      .catch(function(){ sess=null; })
      .then(function(){ setBusy(false); });
  }
  $('enter').addEventListener('click',function(){submit('signIn');});
  $('signup').addEventListener('click',function(){submit('signUp');});
  $('logout').addEventListener('click',logout);
  nickIn.addEventListener('keydown',function(e){if(e.key==='Enter') passIn.focus();});
  passIn.addEventListener('keydown',function(e){if(e.key==='Enter') submit('signIn');});

  /* ---------- персонаж и титулы ---------- */
  // Условия титулов можно менять тут: n — выпавшее число, p — предыдущее, g — статистика игрока
  var TITLES=[
    {id:'newbie',name:'Новичок',desc:'Есть у каждого с самой регистрации',check:function(){return true;}},
    {id:'luck',name:'Мистер удача',desc:'Выкрути зеро',check:function(n){return n===0;}},
    {id:'unlucky',name:'Мистер неудача',desc:'Выкрути число 13',check:function(n){return n===13;}},
    {id:'bum',name:'Бомж',desc:'Чёрное выпало 5 раз подряд',check:function(n,p,g){return g.blackRun>=5;}},
    {id:'hen',name:'Мама курица',desc:'Выкрути одно и то же число два раза подряд',check:function(n,p){return n===p;}}
  ];
  function titleName(id){
    for(var i=0;i<TITLES.length;i++){ if(TITLES[i].id===id) return TITLES[i].name; }
    return '';
  }
  function defaultGame(){return {spins:0,red:0,black:0,zero:0,last:-1,blackRun:0,title:'newbie',earned:{newbie:true}};}
  function gameUrl(t){return DB_URL+'/users/'+sess.uid+'/game.json?auth='+encodeURIComponent(t);}
  function saveGame(){
    if(!game||!sess) return Promise.resolve();
    return token().then(function(t){
      return fetch(gameUrl(t),{method:'PUT',body:JSON.stringify(game)});
    }).catch(function(){});
  }
  function loadGame(){
    return token().then(function(t){return fetch(gameUrl(t));}).then(function(r){return r.json();}).then(function(g){
      if(g&&typeof g==='object'&&!g.error){
        game=defaultGame();
        for(var k in g) game[k]=g[k];
        if(!game.earned||typeof game.earned!=='object') game.earned={newbie:true};
        game.earned.newbie=true;
        renderChar();
      }else{
        game=defaultGame(); renderChar(); return saveGame();
      }
    }).catch(function(){ if(!game){game=defaultGame(); renderChar();} });
  }
  var toastTimer=null;
  function toast(text){
    var el=$('toast'); el.textContent=text; el.className='on';
    clearTimeout(toastTimer); toastTimer=setTimeout(function(){el.textContent='';el.className='';},7000);
  }
  function onSpin(n){
    if(!game) return;
    var prev=game.last, c=color(n);
    game.spins++; game[c==='green'?'zero':c]++;
    game.blackRun=(c==='black')?game.blackRun+1:0;
    game.last=n;
    var got=[];
    TITLES.forEach(function(t){
      if(!game.earned[t.id]&&t.check(n,prev,game)){game.earned[t.id]=true; got.push(t.name);}
    });
    if(got.length){ toast('Новый титул: '+got.join(', ')); $('dot').hidden=false; }
    saveGame(); renderChar();
  }
  function renderChar(){
    if(!game) return;
    $('charName').textContent=nick;
    $('charTitle').textContent=titleName(game.title)||'Новичок';
    $('stSpins').textContent=game.spins; $('stRed').textContent=game.red;
    $('stBlack').textContent=game.black; $('stZero').textContent=game.zero;
    var list=$('tlist'); list.innerHTML='';
    TITLES.forEach(function(t){
      var has=!!game.earned[t.id];
      var row=document.createElement('div'); row.className='titem'+(has?'':' locked');
      var left=document.createElement('div');
      var a=document.createElement('div'); a.className='tn'; a.textContent=t.name;
      var b=document.createElement('div'); b.className='td'; b.textContent=t.desc;
      left.appendChild(a); left.appendChild(b); row.appendChild(left);
      if(has){
        var bt=document.createElement('button'); var worn=game.title===t.id;
        bt.textContent=worn?'Надет':'Надеть'; bt.disabled=worn;
        bt.addEventListener('click',function(){game.title=t.id; saveGame(); renderChar();});
        row.appendChild(bt);
      }else{
        var lk=document.createElement('span'); lk.className='lock'; lk.textContent='Закрыто'; row.appendChild(lk);
      }
      list.appendChild(row);
    });
  }
  function showTab(which){
    var g=(which==='game');
    $('gamePane').hidden=!g; $('charPane').hidden=g;
    $('tabGame').className='tab'+(g?' on':''); $('tabChar').className='tab'+(g?'':' on');
    if(g) draw(); else {$('dot').hidden=true; renderChar();}
  }
  $('tabGame').addEventListener('click',function(){showTab('game');});
  $('tabChar').addEventListener('click',function(){showTab('char');});

  /* ---------- колесо ---------- */
  var canvas=$('wheel'), ctx=canvas.getContext('2d');
  var numEl=$('num'), labelEl=$('label'), btn=$('spin');
  var rot=0, spinning=false;
  var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function draw(){
    var size=canvas.clientWidth; if(!size) return;
    var dpr=window.devicePixelRatio||1;
    if(canvas.width!==Math.round(size*dpr)){canvas.width=Math.round(size*dpr);canvas.height=Math.round(size*dpr);}
    var s=canvas.width, r=s/2;
    ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,s,s); ctx.translate(r,r);
    for(var i=0;i<N;i++){
      var a=-Math.PI/2+i*SEG+rot;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,r,a-SEG/2,a+SEG/2); ctx.closePath();
      ctx.fillStyle=FILL[color(ORDER[i])]; ctx.fill();
      ctx.strokeStyle='rgba(224,181,80,.55)'; ctx.lineWidth=Math.max(1,s/400); ctx.stroke();
      ctx.save(); ctx.rotate(a); ctx.translate(r*0.86,0); ctx.rotate(Math.PI/2);
      ctx.fillStyle='#fff'; ctx.font='700 '+Math.round(s*0.046)+'px Manrope,system-ui,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(String(ORDER[i]),0,0); ctx.restore();
    }
    ctx.beginPath(); ctx.arc(0,0,r*0.62,0,TAU); ctx.fillStyle='rgba(0,0,0,.18)'; ctx.fill();
    ctx.beginPath(); ctx.arc(0,0,r*0.5,0,TAU); ctx.fillStyle='#1f5a3f'; ctx.fill();
    ctx.lineWidth=Math.max(2,s/160); ctx.strokeStyle='#b8892f'; ctx.stroke();
    ctx.beginPath(); ctx.arc(0,0,r*0.09,0,TAU); ctx.fillStyle='#b8892f'; ctx.fill();
  }
  function ease(t){return 1-Math.pow(1-t,4);}

  function show(n){
    var c=color(n);
    numEl.textContent=n; numEl.className='num '+c;
    labelEl.textContent=c==='green'?'Зеро':(c==='red'?'Красное':'Чёрное');
    onSpin(n);
    post({kind:'spin',n:n});
  }
  function spin(){
    if(spinning) return;
    spinning=true; btn.disabled=true; labelEl.textContent='Крутится…';
    var k=Math.floor(Math.random()*N), jitter=(Math.random()-.5)*SEG*0.7, start=rot;
    var base=((-k*SEG+jitter)-start)%TAU; if(base<0) base+=TAU;
    var target=start+(5+Math.floor(Math.random()*3))*TAU+base;
    var dur=reduce?300:5200, t0=performance.now();
    function frame(now){
      var t=Math.min(1,(now-t0)/dur);
      rot=start+(target-start)*ease(t); draw();
      if(t<1) requestAnimationFrame(frame);
      else{rot=target; spinning=false; btn.disabled=false; show(ORDER[k]);}
    }
    requestAnimationFrame(frame);
  }
  btn.addEventListener('click',spin);
  window.addEventListener('resize',draw);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);

  /* ---------- чат (Firebase Realtime Database через обычные запросы) ---------- */
  // Адрес базы (Realtime Database -> Data), без слэша в конце:
  var DB_URL='https://flamer-b1592-default-rtdb.firebaseio.com';
  // Web API Key (Project settings -> General):
  var API_KEY='AIzaSyDFbBbjzJOmiqnoJkrfOaNfv63Fq3lld7c';

  var msgsEl=$('msgs'), msgIn=$('msgIn'), sendBtn=$('send'), noteEl=$('chatNote');
  var docs=[], lastSig='';
  function configured(){return DB_URL.indexOf('ВАШ-ПРОЕКТ')===-1 && API_KEY.indexOf('ВСТАВЬ')===-1;}
  var chatReady=configured();

  function renderChat(){
    msgsEl.innerHTML='';
    if(!docs.length){
      var e=document.createElement('div'); e.className='empty';
      e.textContent=chatReady?'Сообщений пока нет. Напиши первым.':'Чат не настроен: впиши DB_URL и API_KEY в файл.';
      msgsEl.appendChild(e); return;
    }
    docs.forEach(function(m){
      var d=document.createElement('div');
      if(m.kind==='spin'){
        d.className='spinLine';
        d.appendChild(document.createTextNode(String(m.name||'Игрок')+' выкрутил'));
        var c=document.createElement('span'); c.className='chip '+color(Number(m.n)); c.textContent=String(m.n);
        d.appendChild(c);
      }else{
        d.className='msg'+(m.uid===uid?' mine':'');
        var w=document.createElement('div'); w.className='who'; w.textContent=String(m.name||'Игрок');
        var tn=titleName(m.title);
        if(tn){var tt=document.createElement('span'); tt.className='tt'; tt.textContent=tn; w.appendChild(tt);}
        var t=document.createElement('div'); t.textContent=String(m.text||'');
        d.appendChild(w); d.appendChild(t);
      }
      msgsEl.appendChild(d);
    });
    msgsEl.scrollTop=msgsEl.scrollHeight;
  }

  function load(){
    if(!chatReady||!sess||!sess.name||document.hidden) return;
    token().then(function(t){
      return fetch(DB_URL+'/chat.json?orderBy=%22%24key%22&limitToLast=100&auth='+encodeURIComponent(t));
    }).then(function(r){return r.json();}).then(function(obj){
      if(!obj||obj.error){ if(obj&&obj.error){noteEl.textContent='Нет доступа к чату: проверь правила в Firebase';} return; }
      var keys=Object.keys(obj).sort();
      var sig=keys.length+':'+keys[keys.length-1];
      if(sig===lastSig) return;
      lastSig=sig;
      docs=keys.map(function(k){return obj[k];});
      renderChat();
    }).catch(function(){});
  }

  function post(fields){
    if(!chatReady||!sess||!sess.name) return Promise.resolve();
    var body={name:sess.name,uid:sess.uid,t:Date.now(),title:(game&&game.title)||'newbie'};
    for(var k in fields) body[k]=fields[k];
    return token().then(function(t){
      return fetch(DB_URL+'/chat.json?auth='+encodeURIComponent(t),{method:'POST',body:JSON.stringify(body)});
    }).then(function(r){ if(!r.ok) throw new Error('bad'); noteEl.textContent=''; load(); })
      .catch(function(){noteEl.textContent='Не удалось отправить. Проверь правила в Firebase и войди заново.';});
  }
  function sendMsg(){
    var v=msgIn.value.trim(); if(!v||!chatReady) return;
    msgIn.value=''; post({kind:'msg',text:v.slice(0,300)});
  }
  sendBtn.addEventListener('click',sendMsg);
  msgIn.addEventListener('keydown',function(e){if(e.key==='Enter') sendMsg();});

  renderChat();
  setInterval(load,2500);
  document.addEventListener('visibilitychange',load);
  restore();
})();
</script>
</body>
</html>
